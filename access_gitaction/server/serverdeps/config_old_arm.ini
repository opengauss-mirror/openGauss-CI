##########################
# global parameters
##########################

# workspace
g_boot_dir=/usr1/build/workspace//openGauss
export CODE_BASE=$g_boot_dir
# user for make fastcheck
g_execute_user=tester2

# pkg type : debug/release
g_release_mode=debug

# server dir
g_src_dir=${g_boot_dir}

#third_party_binarylibs dir
binarylibs_path=${g_boot_dir}/../openGauss-third_party_binarylibs

# build dir
g_build_dir=${g_boot_dir}/install

# port for fastcheck
g_check_port=8798

# clean user
g_clean_user=tester,tester1,tester2


##########################
# env parameters
##########################
export MPPHOME=${g_boot_dir}/src/test/regress/tmp_check/install"${g_build_dir}"
export GAUSSHOME=${g_boot_dir}/src/test/regress/tmp_check/install"${g_build_dir}"
export MPPDB_CODE=${g_boot_dir}/../openGauss-third_party_binarylibs
export CC="${MPPDB_CODE}/buildtools/openeuler_aarch64/gcc7.3/gcc/bin/gcc"
export CXX="${MPPDB_CODE}/buildtools/openeuler_aarch64/gcc7.3/gcc/bin/g++"
export LD_LIBRARY_PATH=${MPPDB_CODE}/buildtools/openeuler_aarch64/gcc7.3/gcc/lib64\
:${MPPDB_CODE}/buildtools/openeuler_aarch64/gcc7.3/isl/lib\
:${MPPDB_CODE}/buildtools/openeuler_aarch64/gcc7.3/mpc/lib\
:${MPPDB_CODE}/buildtools/openeuler_aarch64/gcc7.3/mpfr/lib\
:${MPPDB_CODE}/buildtools/openeuler_aarch64/gcc7.3/gmp/lib\
:${g_build_dir}/lib\
:$LD_LIBRARY_PATH
export JAVA_HOME=${MPPDB_CODE}/platform/openeuler_aarch64/openjdk8/jdk1.8.0_222
export PATH=${MPPDB_CODE}/buildtools/openeuler_aarch64/gcc7.3/gcc/bin:$PATH
export LD_LIBRARY_PATH=${g_build_dir}/lib:${g_build_dir}/lib/postgresql:${LD_LIBRARY_PATH}

# LANG
LANG="en_US.UTF-8"
SYSFONT="latarcyrheb-sun16"

##########################
# 回传
##########################

g_retrans_enable=1
g_master_user=root
g_master_log_path=/home/mpp/log_fastcheck
g_top_build_id=${BUILD_TOP_ID}
g_cur_build_id=${BUILD_ID}

