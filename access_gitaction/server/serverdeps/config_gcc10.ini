##########################
# global parameters
##########################

# workspace
g_boot_dir=/usr1/build/workspace//openGauss
# user for make fastcheck
g_execute_user=tester2

# pkg type : debug/release
g_release_mode=debug

# server dir
g_src_dir=${g_boot_dir}

#third_party_binarylibs dir
binarylibs_path=${g_boot_dir}/../openGauss-third_party_binarylibs

# build dir
g_build_dir=${g_boot_dir}/install

# port for fastcheck
g_check_port=8798

# clean user
g_clean_user=tester,tester1,tester2

##########################
# env parameters
##########################
export CODE_BASE=${g_boot_dir}
export BINARYLIBS=${binarylibs_path}
export GAUSSHOME=$CODE_BASE/install
export GCC_PATH=$BINARYLIBS/buildtools/gcc10.3/
export CC=$GCC_PATH/gcc/bin/gcc
export CXX=$GCC_PATH/gcc/bin/g++
export LD_LIBRARY_PATH=$GAUSSHOME/lib:$GCC_PATH/gcc/lib64:$GCC_PATH/isl/lib:$GCC_PATH/mpc/lib/:$GCC_PATH/mpfr/lib/:$GCC_PATH/gmp/lib/:$LD_LIBRARY_PATH
export PATH=$GAUSSHOME/bin:$GCC_PATH/gcc/bin:$PATH

# LANG
LANG="en_US.UTF-8"
SYSFONT="latarcyrheb-sun16"
