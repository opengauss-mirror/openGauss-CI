name: og-3rd-sync

on:
  push:
    branches:
      - master
  pull_request_comment:
    types:
      - created
    branches:
      - master
      - '**'
    comments:
      - '^\s*/sync-3rd\s*$'
      - '^\s*/check-3rd\s*$'
  workflow_dispatch:

permissions:
  repository: write
  pr: write
  note: write

stages:
  sync:
    name: openGauss-CI-Sync-3rd
    select: selected_by_default
    jobs:
      openGauss_Sync_3rd:
        name: fastcheck_A
        timeout-minutes: 60
        runs-on: [ self-hosted, arch=arm ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspore/mindspore_python3.11:v0.1
          options: --user root
        steps:
          - name: run_fastcheck
            env:
              ALLOW_DELETE: '1'
              AUTO_APPROVE: '1'
            run: |
              echo "--------------- openGauss-CI-Sync-3rd job start -----------------"
              df -h

              if [ "${MERGE_REQUEST_NOTE}" == "check-3rd" ]; then
                echo "----- query 3rd info -----------"

              elif [ "${MERGE_REQUEST_NOTE}" == "sync-3rd" ]; then
                echo "----- sync 3rd info ----------"
                
              else
                echo "------- not kown note ${MERGE_REQUEST_NOTE} --- skip -------"
              fi
              
              echo "--------------- openGauss-CI-Sync-3rd job end -----------------"
      