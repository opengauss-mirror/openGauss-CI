name: og-3rd-sync

on:
  push:
    branches:
      - master
  pull_request_target:
    # AtomGit 的活动名是 open、update、reopen。opened 和 synchronize 过不了校验。
    # 不在这里 paths-ignore：纯 .gitcode/doc/docs/docs-lite 变更也必须起流水线，
    # 由 prepare 打 ci-pipeline-success 并跳过 LLT；否则平台不触发、合入缺 success 标签。
    types:
      - open
      - update
      - reopen
    branches:
      - master
      - '**'
  pull_request_comment:
    types:
      - created
    branches:
      - master
      - '**'
    comments:
      - '^\s*/sync-3rd\s*$'
      - '^\s*/check-3rd\s*$'
  workflow_dispatch:

permissions:
  repository: write
  pr: write
  note: write

stages:
  sync:
    name: openGauss-CI-Sync-3rd
    select: selected_by_default
    jobs:
      openGauss_Sync_3rd:
        name: fastcheck_A
        timeout-minutes: 60
        runs-on: [ self-hosted, arch=arm ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspore/mindspore_python3.11:v0.1
          options: --user root
        steps:
          - name: run_fastcheck
            env:
              ALLOW_DELETE: '1'
              AUTO_APPROVE: '1'
            run: |
              echo "--------------- openGauss-CI-Sync-3rd job start -----------------"
              df -h

              if [ "${MERGE_REQUEST_NOTE}" == "check-3rd" ]; then
                echo "----- query 3rd info -----------"

              elif [ "${MERGE_REQUEST_NOTE}" == "sync-3rd" ]; then
                echo "----- sync 3rd info ----------"

              else
                echo "------- not kown note ${MERGE_REQUEST_NOTE} --- skip -------"
              fi
              
              echo "--------------- openGauss-CI-Sync-3rd job end -----------------"
      
